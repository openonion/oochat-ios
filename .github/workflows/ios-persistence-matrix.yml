name: Persistence across iOS versions

# Runs the SwiftData persistence tests on more than one iOS version.
#
# It exists because those tests once passed on iOS 26 and failed on iOS 17.5 —
# 22 of them — while CI only ever ran the newest runtime. A message's
# `conversation` back-reference was never set; iOS 18 and later fill the inverse
# in when you assign a parent's to-many array, iOS 17 does not, and a
# relationship written from one side reads back empty from both. Nothing errored,
# so the failure was invisible to a single-runtime CI.
#
# The bug is fixed. This job is what stops it coming back: the normal CI job
# still runs one runtime, and a regression here would be silent again.
#
# Manual for now — promote it to `push` if it proves stable on the runners.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    name: Persistence on iOS ${{ matrix.ios }}
    runs-on: macos-26
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ios: ['18.0', '18.5', '26.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: List available runtimes
        run: xcrun simctl list runtimes available

      - name: Resolve a device on iOS ${{ matrix.ios }}
        id: sim
        run: |
          # Resolve by runtime rather than by device name: runner images change
          # their device line-up between releases, and a hardcoded name is the
          # first thing to break when they do.
          # Resolve by runtime rather than by device name: runner images change
          # their device line-up between releases, and a hardcoded name is the
          # first thing to break when they do.
          #
          # jq, not an inline python heredoc — an embedded script's own
          # indentation has to survive YAML's block scalar, and the first version
          # of this step did not parse at all because of it.
          want=$(echo "${{ matrix.ios }}" | tr '.' '-')
          udid=$(xcrun simctl list devices available --json \
            | jq -r --arg want "iOS-$want" \
              '.devices | to_entries[] | select(.key | endswith($want)) | .value[0].udid // empty' \
            | head -1)
          if [ -z "$udid" ]; then
            echo "::warning::No simulator for iOS ${{ matrix.ios }} on this runner"
            exit 78
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run the persistence tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OOChatIOS.xcodeproj \
            -scheme OOChatIOS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -only-testing:OOChatIOSTests/SwiftDataConversationRepositoryTests \
            -resultBundlePath "build/floor-${{ matrix.ios }}.xcresult"

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floor-${{ matrix.ios }}
          path: build/floor-${{ matrix.ios }}.xcresult
